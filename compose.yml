# ============================================================================
# CustomProxy - standalone container
#
#   cp .env.example .env      # fill in PROXY_AUTH_TOKEN + your provider keys
#   docker compose up -d --build
#   -> http://127.0.0.1:3001/v1
#
# Everything the container needs comes from this directory. There are no
# external networks, host paths, or sibling projects to create first.
# ============================================================================
name: customproxy

services:
  customproxy:
    build: .
    image: customproxy:latest
    container_name: customproxy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only enough to chown the writable mounts and drop to `app`.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 256
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional on disk so `docker compose config` works before the first copy
    # of .env.example; the interpolation below then fails with a clear message.
    env_file:
      - path: .env
        required: false
    environment:
      # The image mounts writable state at the absolute /state and /logs.
      # (Running from a plain checkout without Docker uses the relative
      # defaults in src/config.json instead.)
      - KILO_CONFIG_PATH=/state/kilo_models.json
      - REQUEST_LOG_JSONL=/logs/requests.jsonl
      # Relays are opt-in: list the MCP services you actually use.
      - KEY_ROTATE_SERVICES=${KEY_ROTATE_SERVICES:-}
      - KEY_PROXY_DEBUG=${KEY_PROXY_DEBUG:-0}
      - CATALOG_REFRESH_SECONDS=${CATALOG_REFRESH_SECONDS:-600}
    ports:
      - "127.0.0.1:${PROXY_HOST_PORT:-3001}:3001"
    volumes:
      - ./key_rotate_proxy.py:/app/key_rotate_proxy.py:ro
      - ./src:/app/customproxy:ro
      - ./state:/state
      - ./logs:/logs
      - ./run-services.sh:/usr/local/bin/customproxy-services.sh:ro
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
